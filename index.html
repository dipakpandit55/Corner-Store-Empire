<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Corner Store Empire</title><link rel='stylesheet' href='style.css'></head><body><header><div><b>🏪 Corner Store Empire</b><small id='day'>Day 1</small></div><div class='money'>$<span id='cash'>500.00</span></div></header><main><section class='stats'><div>⭐ <span id='rep'>50</span></div><div>👥 <span id='customers'>0</span> served</div><div>💰 $<span id='profit'>0.00</span> profit</div></section><section id='store'><div class='sign'>YOUR CORNER STORE</div><div id='customerLane'></div><div class='counter'>🧑‍💼 CHECKOUT</div><div class='shelves' id='shelves'></div></section><section class='panel'><h2>Inventory</h2><div id='products'></div><button id='openBtn' class='primary'>▶ OPEN STORE</button><button id='nextBtn'>🌙 End Day</button></section><section class='panel'><h2>Upgrades</h2><div class='upgrade'><span>🧊 Bigger Cooler<br><small>+2 drink capacity</small></span><button onclick="buyUpgrade('cooler')">$150</button></div><div class='upgrade'><span>☕ Coffee Station<br><small>Unlock coffee</small></span><button onclick="buyUpgrade('coffee')">$250</button></div><div class='upgrade'><span>📣 Local Advertising<br><small>More customers</small></span><button onclick="buyUpgrade('ads')">$300</button></div></section><section class='panel'><h2>Activity</h2><div id='log'></div></section></main><script src='game.js'></script></body></html>
