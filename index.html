<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Corner Store Empire V6</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<header><div><h1>🏪 Corner Store Empire <b>V6</b></h1><small id="day"></small></div><div class="money" id="cash"></div></header>
<main><section class="stats"><div id="profit"></div><div id="served"></div><div id="rep"></div><div id="stock"></div></section>
<div class="gamewrap"><canvas id="game" width="1200" height="720"></canvas><div id="toast">V6 loaded — realistic store simulation ready.</div></div>
<section class="controls"><button id="openBtn"></button><button id="buildBtn">🔨 BUILD</button><button id="endBtn">🌙 END DAY</button><button id="hireBtn"></button><button id="deliveryBtn">🚚 ORDER DELIVERY $40</button><button id="expandBtn"></button></section>
<section id="buildPanel" class="panel"><h3>Build Shop</h3><div class="shop"><button data-build="shelf">🗄️ Shelf<br>$75</button><button data-build="fridge">🧊 Refrigerator<br>$150</button><button data-build="coffee">☕ Coffee Station<br>$225</button><button data-build="hotfood">🍕 Hot Food<br>$300</button><button data-build="trash">🗑️ Trash Can<br>$60</button></div><p id="buildStatus">Build mode off.</p></section>
<section class="panel"><h3>How to play</h3><p><b>Move:</b> WASD / Arrow keys. <b>Interact:</b> E. Pick up stock, refill shelves, clean spills, and run checkout. Close the store before Build Mode. Press <b>R</b> to rotate equipment.</p></section><section class="panel"><h3>Store status</h3><div id="status"></div></section>
<div class="mobile"><div><button data-key="ArrowUp">▲</button></div><div><button data-key="ArrowLeft">◀</button><button id="interact">E</button><button data-key="ArrowRight">▶</button></div><div><button data-key="ArrowDown">▼</button></div></div></main><script src="game.js?v=6"></script></body></html>
