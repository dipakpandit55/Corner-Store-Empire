<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Corner Store Empire V2</title><link rel='stylesheet' href='style.css'></head><body>
<header><div><b>🏪 Corner Store Empire</b><small id='day'>Day 1</small></div><div class='money' id='money'>$500.00</div></header>
<main><section class='stats'><span>⭐ <b id='rep'>50</b></span><span>👥 <b id='served'>0</b> served</span><span>💰 <b id='profit'>$0.00</b> profit</span><span>📦 <b id='stockCount'>24</b> items</span></section>
<section class='game-card'><div class='sign'>YOUR CORNER STORE • V2</div><div id='store' class='store'><div class='door'>🚪<small>ENTRANCE</small></div><div class='shelf s1' data-product='Soda'>🥤<small>SODA</small></div><div class='shelf s2' data-product='Chips'>🍟<small>CHIPS</small></div><div class='shelf s3' data-product='Candy'>🍫<small>CANDY</small></div><div class='shelf s4' data-product='Water'>💧<small>WATER</small></div><div class='counter'>🧑‍💼<small>CHECKOUT</small></div><div id='people'></div></div></section>
<section class='panel'><h3>Store Controls</h3><div class='buttons'><button id='open' class='primary'>▶ OPEN STORE</button><button id='end'>🌙 End Day</button></div><div id='status'>Store is closed. Restock and open when ready.</div></section>
<section class='panel'><h3>Inventory</h3><div id='inventory'></div></section>
<section class='panel'><h3>Upgrades</h3><div id='upgrades'></div></section>
<section class='panel'><h3>Activity</h3><div id='log' class='log'></div></section></main>
<script src='game.js'></script></body></html>
